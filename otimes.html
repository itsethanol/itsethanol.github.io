<!DOCTYPE html>
<html>
<head>
    <title>ordinary times</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: "Courier New";
            background-color: #333333;
            overflow-x: hidden;
        }
        .page {
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .page-1 {
          height: 100vh;
          width: 100%;
          overflow: hidden;
        }

        img {
            filter: invert(100%);
        }

        .page-1 img {
          width: 100%;
          height: auto;
          object-fit: cover;
        }

        .page-2, .page-3, .page-4 {
          width: 80%;
          margin: 0 auto;
          max-width: 768px;
        }

        .page-2 img, .page-3 img, .page-4 img {
          width: 100%;
          height: auto;
        }

        /* Media queries for smaller screens */

        @media (max-width: 768px) {

          .page {
            width: 100%;
            margin: 0 auto;
          }

          .page-1 img {
            width: 110%;
            height: auto;
            margin-left: -10%;
            margin-right: -10%;          
          }

          .page-2 img, .page-3 img, .page-4 img {
            width: 120%;
            height: auto;
            margin-left: -20%;
            margin-right: -20%;
          }

        }

         #bottom {
            bottom: 0px;
            width: 100%;
            line-height: 2;
            text-align: center;
            font-size: 10px;
        }

        .link {
            background-color: #595838;
        }

    </style>
</head>
<body>

    <div class="page page-1">
      <img src="1.png" alt="Page 1">
    </div>
    <div class="page page-2">
      <img src="2.png" alt="Page 2">
    </div>
    <div class="page page-3">
      <img src="3.png" alt="Page 3">
    </div>
    <div class="page page-4">
      <img src="4.png" alt="Page 4">
    </div>


    <div id="bottom">
        <a href="https://campsite.bio/ethanol" class="link">listen to 'ordinary time'</a>
        /
        interview
        /
        <a href="index.html" class="link">ethanol: 2020-2023</a>
        /
        <a href="brian.html" class="link">for brian</a>
    </div>

</body>
</html>
