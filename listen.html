    <script>
        // 1. Get references to the elements using their IDs
        const audio = document.getElementById('soundtrack');
        const gifImg = document.getElementById('pianoGif');

        // 2. Define the state change function
        const playAudio = () => {
            // When audio starts, switch to the animated GIF source
            gifImg.src = 'piano.gif'; 
        };

        const pauseAudio = () => {
            // When audio pauses, switch back to the still frame GIF source
            gifImg.src = 'piano.png'; 
        };

        // 3. Attach listeners to the audio controls
        audio.addEventListener('play', playAudio);
        audio.addEventListener('pause', pauseAudio);
        audio.addEventListener('ended', pauseAudio); // Ensure it stops when song is done

    </script>
