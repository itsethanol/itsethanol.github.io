<!DOCTYPE html>
<html>
<head>
    <title>flight of the navigator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: "Courier New";
            background-color: #ebebeb;
			overflow-x: hidden;
        }
        .brochure {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
        }

        .page {
          width: 45%; /* adjust this value to control the spacing between pages */
          margin: 0px;
        }

        .page img {
          width: 100%;
          height: auto;
          border-radius: 0px;
		  clip-path: inset(30px 0 30px 0); /* adjust the values as needed */
          margin-top: -30px;
          margin-bottom: -30px;
        }

        /* Optional: add a bi-fold effect on larger screens */
        @media (min-width: 768px) {
          .brochure {
            flex-direction: row;
          }
          .page-1, .page-4 {
            transform: rotateY(10deg);
          }
          .page-2, .page-3 {
            transform: rotateY(-10deg);
          }
        }

        /* Make the brochure responsive on smaller screens */
        @media (max-width: 768px) {
          .brochure {
            flex-direction: column;
          }
          .page {
            width: 100%;
            margin: 0px auto;
          }
          .page img {
            width: 110%;
            height: auto;
            margin-left: -5%;
            margin-right: -5%;
			clip-path: inset(60px 0 60px 0); /* adjust the values as needed */
            margin-top: -60px;
            margin-bottom: -60px;
          }
        }
        #bottom {
        	bottom: 0px;
        	width: 100%;
		    line-height: 2;
		    text-align: center;
		    font-size: 10px;
        }
    </style>
</head>
<body>

    <div class="brochure">
      <div class="page page-1">
        <img src="flight1.png" alt="Page 1">
      </div>
      <div class="page page-2">
        <img src="flight2.png" alt="Page 2">
      </div>
      <div class="page page-3">
        <img src="flight3.png" alt="Page 3">
      </div>
      <div class="page page-4">
        <img src="flight4.png" alt="Page 4">
      </div>
    </div>

    <div id="bottom">
        <a href="https://campsite.bio/ethanol" class="link">listen to 'ordinary time'</a>
        /
        <a href="index.html" class="link">ethanol: 2020-2023</a>
        /
        <a href="brian.html" class="link">for brian</a>
    </div>

</body>
</html>
