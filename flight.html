<!DOCTYPE html>
<html>
<head>
    <title>flight of the navigator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: "Courier New";
            background-color: #ebebeb;
            overflow-x: hidden;
        }
        .page {
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 20px;
        }

        .page-1 {
          height: 100vh;
          width: 100%;
          overflow: hidden;
        }

        .page-1 img {
          width: 100%;
          height: auto;
          object-fit: cover;
        }

        .page-2, .page-3, .page-4 {
          width: 80%;
          margin: 0 auto;
        }

        .page-2 img, .page-3 img, .page-4 img {
          width: 100%;
          height: auto;
          margin-top: -15vh;
          margin-bottom: -15vh;
        }

        /* Media queries for smaller screens */

        @media (max-width: 1020px) {
          .page-2 img, .page-3 img, .page-4 img {
            margin-top: -12vh;
            margin-bottom: -12vh;
          }
        }

        @media (max-width: 768px) {

          .page {
            width: 100%;
          }

          .page img {
            width: 110%;
            height: auto;
            margin-left: -5%;
            margin-right: -5%;
            margin-top: -9vh;
            margin-bottom: -9vh;
          }
        }

         #bottom {
            bottom: 0px;
            width: 100%;
            line-height: 2;
            text-align: center;
            font-size: 10px;
        }
    </style>
</head>
<body>

    <div class="page page-1">
      <img src="flight1.png" alt="Page 1">
    </div>
    <div class="page page-2">
      <img src="flight2.png" alt="Page 2">
    </div>
    <div class="page page-3">
      <img src="flight3.png" alt="Page 3">
    </div>
    <div class="page page-4">
      <img src="flight4.png" alt="Page 4">
    </div>


    <div id="bottom">
        <a href="https://campsite.bio/ethanol" class="link">listen to 'ordinary time'</a>
        /
        <a href="index.html" class="link">ethanol: 2020-2023</a>
        /
        <a href="brian.html" class="link">for brian</a>
    </div>

</body>
</html>
